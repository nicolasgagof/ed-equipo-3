<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Icono de RecoRun: una R verde lima corriendo con zapatillas de running">
  <defs>
    <!-- Zapatilla de running pequeña: el talón (0,0) se une al final de cada pata -->
    <g id="zapatilla">
      <path d="M-1.5 -2 L2 -2 C2.6 -0.6 3.8 0 5.4 0.2 C7.4 0.5 8.4 1.3 8.4 2.6 L8.4 3.2 L-1.5 3.2 Z" fill="#FFFFFF"/>
      <path d="M-1.5 3.2 H8.4 V4 Q8.4 4.6 7.8 4.6 H-0.9 Q-1.5 4.6 -1.5 4 Z" fill="#C6F432"/>
      <path d="M0.6 1.9 Q3.6 2.1 6.4 1" fill="none" stroke="#C6F432" stroke-width="0.9" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0E1508"/>
  <!-- La R inclinada hacia delante, como corriendo -->
  <g transform="rotate(14 32 32) translate(1 -1)">
    <g fill="none" stroke="#C6F432" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pata de atrás: baja recta y se dobla hacia atrás -->
      <path d="M22 11 V35 L16.5 44"/>
      <!-- Panza de la R -->
      <path d="M22 11 H33 a7.5 7.5 0 0 1 0 15 H22"/>
      <!-- Pata de delante: estirada hacia delante -->
      <path d="M30 26 L41 39"/>
    </g>
    <!-- Zapatillas encajadas al final de cada pata -->
    <use href="#zapatilla" transform="translate(16 45) rotate(38)"/>
    <use href="#zapatilla" transform="translate(41 40) rotate(-14)"/>
  </g>
</svg>
